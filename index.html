    <!-- Prevent flash of wrong theme -->
    <script>
        try {
            var t = localStorage.getItem('askwisely-theme');
            if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            }
        } catch(e) {}

<script>
    // Restore clean URL from GitHub Pages 404.html SPA redirect

        var spa = p.get('_spa');
        if (spa) window.history.replaceState(null, '', spa);
    })();
</script>
