<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script>
        // GitHub Pages SPA redirect
        // Sends the original path to index.html via a query param so the app can restore it
        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            '/?_spa=' + encodeURIComponent(l.pathname + l.search + l.hash)
        );
    </script>
    <meta name="robots" content="noindex">
    <title>Redirecting…</title>
</head>
<body></body>
</html>
